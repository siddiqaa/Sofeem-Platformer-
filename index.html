<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            background-color: #bae6fd; font-family: sans-serif;
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        @media (orientation: landscape) and (max-height: 500px) {
            #joystick-base { width: 5rem !important; height: 5rem !important; }
            #joystick-stick { width: 3rem !important; height: 3rem !important; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="flex flex-col h-screen w-screen bg-sky-300 font-sans overflow-hidden relative">
        <!-- HUD / Top Bar -->
        <header class="flex justify-between items-center p-3 md:p-6 landscape:p-1.5 bg-transparent relative z-20 transition-all">
            <div class="flex gap-2">
                <div class="bg-white rounded-full px-3 py-1 landscape:px-3 landscape:py-0.5 shadow-lg border-2 md:border-4 border-yellow-400 flex items-center gap-1.5">
                    <span class="text-base md:text-xl">⭐</span>
                    <span id="score-display" class="text-base md:text-xl font-black text-blue-900 tracking-tight">0</span>
                </div>
                <div class="bg-white rounded-full px-3 py-1 landscape:px-3 landscape:py-0.5 shadow-lg border-2 md:border-4 border-red-400 flex items-center gap-1.5">
                    <span class="text-base md:text-xl">❤️</span>
                    <span id="lives-display" class="text-base md:text-xl font-black text-blue-900 tracking-tight">×3</span>
                </div>
            </div>
            <div class="bg-white/90 rounded-xl px-4 py-1 landscape:px-4 landscape:py-0.5 shadow-xl border-2 md:border-4 border-white flex flex-col items-center min-w-[100px]">
                <span class="text-[8px] md:text-xs landscape:text-[7px] font-bold text-sky-600 uppercase tracking-widest">Level 01</span>
                <h1 class="text-xs md:text-lg font-black text-blue-900 truncate max-w-[120px]">Vibrant Plains</h1>
            </div>
        </header>

        <!-- Game World Area -->
        <main class="flex-1 relative bg-gradient-to-b from-sky-300 via-sky-200 to-sky-100 overflow-hidden">
            <div id="phaser-game" class="absolute inset-0 z-10"></div>

            <!-- Overlaid Joystick Controls -->
            <div id="joystick-base" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-24 h-24 md:w-32 md:h-32 landscape:w-20 landscape:h-20 bg-sky-400/25 backdrop-blur-sm rounded-full shadow-lg flex items-center justify-center border-4 border-white/50 touch-none z-30 transition-all">
                <div id="joystick-stick" class="w-12 h-12 md:w-18 md:h-18 landscape:w-10 landscape:h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-full shadow-2xl border-b-4 md:border-b-8 border-orange-800 flex items-center justify-center pointer-events-none">
                    <div class="w-4 h-4 md:w-6 md:h-6 landscape:w-2 landscape:h-2 bg-white rounded-full opacity-20"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        let currentScore = 0;
        let lives = 3;
        let isInvulnerable = false;
        const controls = { left: false, right: false, jump: false };
        window.controls = controls;

        const config = {
            type: Phaser.AUTO,
            parent: 'phaser-game',
            transparent: true,
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 600 }, debug: false }
            },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);
        window.game = game;
        let player, platforms, cursors, stars, monsters, gameOver = false;

        function preload() {}

        function create() {
            gameOver = false;
            currentScore = 0;
            scoreDisplay.innerText = '0';
            lives = 3;
            livesDisplay.innerText = '×3';
            isInvulnerable = false;

            const { width, height } = this.scale;

            platforms = this.physics.add.staticGroup();
            
            // Ground
            const ground = this.add.rectangle(width / 2, height - 20, width, 40, 0x22c55e);
            this.physics.add.existing(ground, true);
            platforms.add(ground);
            this.add.rectangle(width / 2, height - 38, width, 4, 0x16a34a);

            // Dynamic Ledges
            const ledges = [
                { x: width / 2, y: height - 40, w: width, h: 40, isGround: true },
                { x: width * 0.75, y: height - 150, w: Math.max(200, width * 0.3), h: 20, color: 0xfb923c },
                { x: width * 0.25, y: height - 250, w: Math.max(180, width * 0.25), h: 20, color: 0xf472b6 },
                { x: width * 0.8, y: height - 340, w: Math.max(150, width * 0.2), h: 20, color: 0xc084fc },
                { x: width * 0.45, y: height - 370, w: Math.max(120, width * 0.15), h: 20, color: 0x60a5fa }
            ];

            ledges.filter(l => !l.isGround).forEach(l => {
                const ledge = this.add.rectangle(l.x, l.y, l.w, l.h, l.color);
                this.physics.add.existing(ledge, true);
                platforms.add(ledge);
                this.add.rectangle(l.x, l.y + 5, l.w, 4, 0x000000, 0.1);
            });

            // Player Setup
            const playerBodyVisual = this.add.rectangle(0, 0, 40, 40, 0xfacc15).setStrokeStyle(4, 0x1e3a8a);
            const eyeLeft = this.add.circle(-8, -5, 4, 0x1e3a8a);
            const eyeRight = this.add.circle(8, -5, 4, 0x1e3a8a);
            const blushLeft = this.add.circle(-12, 5, 3, 0xf472b6, 0.6);
            const blushRight = this.add.circle(12, 5, 3, 0xf472b6, 0.6);
            
            player = this.add.container(Math.min(100, width * 0.1), height - 70, [playerBodyVisual, eyeLeft, eyeRight, blushLeft, blushRight]);
            this.physics.add.existing(player);
            player.body.setBounce(0.1).setCollideWorldBounds(true).setSize(40, 40).setOffset(-20, -20);

            // Monsters Setup
            monsters = this.physics.add.group();
            ledges.forEach((l, index) => {
                const mBodyVisual = this.add.rectangle(0, 0, 30, 30, 0xef4444).setStrokeStyle(3, 0x7f1d1d);
                const eyeL = this.add.rectangle(-6, -4, 6, 8, 0xffffff);
                const eyeR = this.add.rectangle(6, -4, 6, 8, 0xffffff);
                const pupilL = this.add.rectangle(-6, -2, 3, 3, 0x000000);
                const pupilR = this.add.rectangle(6, -2, 3, 3, 0x000000);
                
                const platformTop = l.y - (l.h / 2);
                const monster = this.add.container(l.x, platformTop - 15, [mBodyVisual, eyeL, eyeR, pupilL, pupilR]);
                this.physics.add.existing(monster);
                monster.body.setBounce(0).setCollideWorldBounds(true).setSize(30, 30).setOffset(-15, -15).setVelocityX(index % 2 === 0 ? 120 : -120);
                
                monster.setData('minX', l.x - l.w / 2 + 15);
                monster.setData('maxX', l.x + l.w / 2 - 15);
                monsters.add(monster);
            });

            cursors = this.input.keyboard.createCursorKeys();

            // Stars Setup
            stars = this.physics.add.group();
            const starCount = 10;
            const spacing = width / (starCount + 1);
            for (let i = 0; i < starCount; i++) {
                const star = this.add.star(spacing * (i + 1), 0, 5, 8, 16, 0xfde047).setStrokeStyle(2, 0xeab308);
                this.physics.add.existing(star);
                star.body.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8)).setCollideWorldBounds(true);
                stars.add(star);
            }

            // Physics Colliders
            this.physics.add.collider(player, platforms);
            this.physics.add.collider(stars, platforms);
            this.physics.add.collider(monsters, platforms);

            this.physics.add.overlap(player, stars, (p, s) => {
                if (s.getData('collecting')) return;
                s.setData('collecting', true);
                this.tweens.add({
                    targets: s, scale: 0, alpha: 0, duration: 200,
                    onComplete: () => {
                        s.destroy();
                        currentScore += 10;
                        scoreDisplay.innerText = currentScore;
                        if (stars.countActive(true) === 0) endGame.call(this, 'YOU WIN!');
                    }
                });
            });

            this.physics.add.overlap(player, monsters, () => {
                if (isInvulnerable || gameOver) return;

                lives--;
                livesDisplay.innerText = '×' + lives;

                if (lives <= 0) {
                    endGame.call(this, 'GAME OVER');
                } else {
                    isInvulnerable = true;
                    player.body.setVelocity(0, 0);
                    player.setPosition(Math.min(100, width * 0.1), height - 70);

                    this.tweens.add({
                        targets: player,
                        alpha: 0.2,
                        duration: 100,
                        yoyo: true,
                        repeat: 9,
                        onComplete: () => {
                            player.alpha = 1;
                            isInvulnerable = false;
                        }
                    });
                }
            });
        }

        function endGame(message) {
            gameOver = true;
            this.physics.pause();
            const { width, height } = this.scale;

            this.add.text(width / 2, height / 2 - 30, message, { fontSize: '64px', color: '#1e3a8a', fontStyle: '900' }).setOrigin(0.5);
            this.add.text(width / 2, height / 2 + 30, 'Click to Restart', { fontSize: '24px', color: '#1e3a8a', fontStyle: 'bold' }).setOrigin(0.5);
            this.input.once('pointerdown', () => this.scene.restart());
        }

        function update() {
            if (gameOver || !player) return;

            if (monsters) {
                monsters.children.iterate(m => {
                    if (!m.body) return true;
                    const { body } = m;
                    const minX = m.getData('minX');
                    const maxX = m.getData('maxX');

                    if (m.x <= minX) {
                        body.setVelocityX(Math.abs(body.velocity.x) || 120);
                    } else if (m.x >= maxX) {
                        body.setVelocityX(-Math.abs(body.velocity.x) || -120);
                    }
                    if (Math.abs(body.velocity.x) < 10) {
                        body.setVelocityX(m.x < (minX + maxX) / 2 ? 120 : -120);
                    }
                    return true;
                });
            }

            const { body } = player;
            const spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
            const isLeft = cursors.left.isDown || controls.left;
            const isRight = cursors.right.isDown || controls.right;
            const isJump = cursors.up.isDown || spaceKey.isDown || controls.jump;

            if (isLeft) {
                body.setVelocityX(-200);
            } else if (isRight) {
                body.setVelocityX(200);
            } else {
                body.setVelocityX(0);
            }

            if (isJump && body.touching.down) {
                body.setVelocityY(-520);
            }
        }

        // Joystick Event Listeners
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        let isDragging = false;

        const handleMove = (e) => {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const stickMax = rect.width * 0.45;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > stickMax) {
                dx *= stickMax / dist;
                dy *= stickMax / dist;
            }
            
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            
            controls.left = dx < -stickMax * 0.3;
            controls.right = dx > stickMax * 0.3;
            controls.jump = dy < -stickMax * 0.5;
        };

        const stopDragging = () => {
            isDragging = false;
            joyStick.style.transform = 'translate(0, 0)';
            controls.left = controls.right = controls.jump = false;
        };

        joyBase.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', stopDragging);

        joyBase.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging = true; handleMove(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if (isDragging) e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchend', stopDragging);
    </script>
</body>
</html>
